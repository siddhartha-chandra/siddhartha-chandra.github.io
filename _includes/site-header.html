<header class="site-header shell">
  <a class="identity" href="{{ '/' | relative_url }}" aria-label="Siddhartha Chandra home">
    <svg class="identity-symbol" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M20 3v34M3 20h34M8 8l24 24M8 32L32 8" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="20" cy="20" r="8" fill="var(--paper)" stroke="currentColor" stroke-width="2.5"/>
    </svg>
    <span>Siddhartha<br>Chandra<span class="identity-dot">.</span></span>
  </a>
  <div class="header-right">
    <nav aria-label="Primary navigation" class="primary-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects/' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/resume/' | relative_url }}"{% if page.url contains '/resume/' %} aria-current="page"{% endif %}>Resume</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% elsif page.url contains '/blog/' %} aria-current="location"{% endif %}>Writing</a>
    </nav>
    <button class="theme-toggle icon-button" type="button" aria-label="Switch color theme" hidden>
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M10 3a7 7 0 0 1 0 14Z" fill="currentColor"/></svg>
    </button>
  </div>
</header>
