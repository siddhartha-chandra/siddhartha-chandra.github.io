<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% if page.redirect %}
    <meta http-equiv="refresh" content="0; url={{ page.redirect }}">
    <link rel="canonical" href="{{ page.redirect }}">
    {% endif %}
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}">
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (error) {}
        document.documentElement.classList.toggle('dark', theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches));
      }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.url == '/' %}
    <script src="{{ '/assets/js/kinetic-field.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/portrait-reveal.js' | relative_url }}" defer></script>
    {% endif %}
    {% if page.url contains '/projects/' %}
    <script src="{{ '/assets/js/rubik-cube.js' | relative_url }}" defer></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include site-header.html %}
    <main id="main-content"{% unless page.url == '/' %} class="shell inner-page"{% endunless %}>
      {{ content }}
    </main>
    {% include site-footer.html %}
  </body>
</html>
