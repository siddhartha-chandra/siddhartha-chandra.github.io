<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% if page.redirect %}
    <meta http-equiv="refresh" content="0; url={{ page.redirect }}">
    <link rel="canonical" href="{{ page.redirect }}">
    {% endif %}
    <link rel="icon" href="{{ '/assets/img/prof_pic.jpg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-shell site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
        <span>Siddhartha</span>
        <span>Chandra</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ '/resume/' | relative_url }}" {% if page.url contains '/resume/' %}aria-current="page"{% endif %}>Resume</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>Blog</a>
        <a href="https://github.com/{{ site.github_username }}">GitHub</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}">LinkedIn</a>
      </nav>
    </header>

    <main class="site-shell">
      {{ content }}
    </main>

    <footer class="site-shell site-footer">
      <span>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</span>
      <span>Built light, kept close to the work.</span>
    </footer>
  </body>
</html>
