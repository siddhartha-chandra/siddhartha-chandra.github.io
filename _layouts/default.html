<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% if page.redirect %}
    <meta http-equiv="refresh" content="0; url={{ page.redirect }}">
    <link rel="canonical" href="{{ page.redirect }}">
    {% endif %}
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}">
    <script>(function(){var d=document.documentElement,c=localStorage.getItem('theme');if(c==='dark'||(!c&&matchMedia('(prefers-color-scheme:dark)').matches))d.classList.add('dark');else d.classList.remove('dark')})()</script>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script src="{{ '/assets/js/rubik-cube.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-shell site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
        <span>Siddhartha</span>
        <span>Chandra</span>
      </a>
      <div class="header-actions">
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>About</a>
          <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %}aria-current="page"{% endif %}>Projects</a>
          <a href="{{ '/resume/' | relative_url }}" {% if page.url contains '/resume/' %}aria-current="page"{% endif %}>Resume</a>
          <a href="{{ '/blog/' | relative_url }}" {% if page.url == '/blog/' %}aria-current="page"{% elsif page.url contains '/blog/' %}aria-current="location"{% endif %}>Blog</a>
        </nav>
        <button type="button" class="theme-toggle" aria-label="Switch color theme">
          <svg class="theme-icon-light" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.5 2.5l1.5 1.5M12 12l1.5 1.5M2.5 13.5l1.5-1.5M12 4l1.5-1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <svg class="theme-icon-dark" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.5 9.5A6 6 0 0 1 6.5 2.5 6 6 0 1 0 13.5 9.5z" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="site-shell" id="main-content">
      {{ content }}
    </main>

    <footer class="site-shell site-footer">
      <div class="footer-intro">
        <p>Good work starts with a conversation.</p>
        <a class="text-link" href="mailto:{{ site.email }}">Say hello <span aria-hidden="true">↗</span></a>
      </div>
      <nav class="social-links" aria-label="Connect">
          <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile (opens in new tab)">
            <span>GitHub</span>
            <svg class="icon-external" width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3.5 2.5h6v6M9.2 2.8L2.5 9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in new tab)">
            <span>LinkedIn</span>
            <svg class="icon-external" width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3.5 2.5h6v6M9.2 2.8L2.5 9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
      </nav>
      <div class="footer-colophon">
        <span>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</span>
        <span>Built light. Always curious.</span>
      </div>
    </footer>
    <script>(function(){var d=document.documentElement,b=document.querySelector('.theme-toggle');b&&b.addEventListener('click',function(){d.classList.toggle('dark');localStorage.setItem('theme',d.classList.contains('dark')?'dark':'light')})})()</script>
  </body>
</html>
