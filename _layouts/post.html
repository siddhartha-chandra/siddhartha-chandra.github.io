---
layout: default
---

<article class="post">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">Back to blog</a>
  <header class="post-header">
    <p class="kicker">{{ page.date | date: '%B %-d, %Y' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
    <p class="post-description">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
